<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedRoute Client Portal — Documents</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E8ECF0}
a{color:#1A5A96}a:hover{color:#0E3F6E}
</style>


</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif; font-size: 14px; color: #1B2430; background: #E8ECF0; min-height: 100vh">

<div style="background: #1A4E80; color: #FFFFFF; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 16px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="0" y="0" width="22" height="22" rx="2" fill="#FFFFFF"></rect><path d="M9 4h4v5h5v4h-5v5H9v-5H4V9h5z" fill="#1A4E80"></path></svg>
<span style="font-weight: 700; font-size: 16px">MedRoute</span>
<span style="font-size: 13px; color: #CFE0F0">Client Portal</span>
</div>
<div style="display: flex; align-items: center; gap: 16px; font-size: 13px; color: #CFE0F0">
<span>Signed in: Christopher Proto, Practice Manager</span>
<button type="button" style="min-height: 32px; padding: 0 10px; border: 1px solid #7FA6CB; background: transparent; color: #FFFFFF; border-radius: 2px; font: 600 13px 'Source Sans 3', Arial, sans-serif; cursor: pointer">Log out</button>
</div>
</div>

<nav aria-label="Portal" style="background: #F7F9FB; border-bottom: 1px solid #AEBBC8; display: flex; flex-wrap: wrap; padding: 0 12px">
<a href="portal.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: #2E3A48; text-decoration: none">Pickups &amp; Tracking</a>
<a href="portal-documents.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; font-weight: 700; color: #1A4E80; text-decoration: none; background: #FFFFFF; border-left: 1px solid #AEBBC8; border-right: 1px solid #AEBBC8; border-top: 3px solid #1A4E80; margin-bottom: -1px">Documents</a>
<a href="portal-schedule.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: #2E3A48; text-decoration: none">Standing Schedule</a>
<a href="portal-billing.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: #2E3A48; text-decoration: none">Billing</a>
<a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: #4A5664; text-decoration: none; margin-left: auto">Staff view ›</a>
</nav>

<div style="background: #DCE6EF; border-bottom: 1px solid #AEBBC8; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 28px; font-size: 13px">
<span><span style="color: #4A5664">Account:</span> <strong>Westpark Family Medicine · WPFM-0142</strong></span>
<span><span style="color: #4A5664">Records kept online:</span> <strong>3 years (sample policy)</strong></span>
</div>

<main style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; max-width: 1600px">

<h1 style="margin: 0; font-size: 20px; font-weight: 700">Documents</h1>

<section aria-label="Filter documents" style="background: #FFFFFF; border: 1px solid #AEBBC8; padding: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Document type
<select onChange="{{ setType }}" style="min-height: 36px; min-width: 240px; padding: 0 8px; border: 1px solid #8C9AA8; border-radius: 2px; font: 14px 'Source Sans 3', Arial, sans-serif; background: #FFFFFF">
<option value="all">All documents</option>
<option value="custody">Chain-of-custody records</option>
<option value="rmw">Medical waste shipping papers</option>
<option value="treat">Treatment confirmations</option>
<option value="temp">Temperature logs</option>
<option value="statement">Monthly statements</option>
</select>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">From
<input type="date" value="2026-10-01" style="min-height: 36px; padding: 0 8px; border: 1px solid #8C9AA8; border-radius: 2px; font: 14px 'Source Sans 3', Arial, sans-serif">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">To
<input type="date" value="2026-11-06" style="min-height: 36px; padding: 0 8px; border: 1px solid #8C9AA8; border-radius: 2px; font: 14px 'Source Sans 3', Arial, sans-serif">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; flex: 1 1 220px">Search by reference or bag ID
<input type="text" placeholder="e.g. RT-2290 or VA-2611-0487" style="min-height: 36px; padding: 0 8px; border: 1px solid #8C9AA8; border-radius: 2px; font: 14px 'Source Sans 3', Arial, sans-serif">
</label>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 2px; border: 1px solid #8C9AA8; background: #FFFFFF; color: #1B2430; font: 600 14px 'Source Sans 3', Arial, sans-serif; cursor: pointer">Download All (ZIP)</button>
</section>

<section aria-label="Document list" style="background: #FFFFFF; border: 1px solid #AEBBC8">
<div style="display: flex; justify-content: space-between; align-items: center; background: #EEF2F6; border-bottom: 1px solid #AEBBC8; padding: 6px 12px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">{{ countLabel }}</h2>
<span style="font-size: 12px; color: #4A5664">Newest first</span>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px">
<thead>
<tr style="text-align: left; background: #F7F9FB">
<th style="padding: 6px 12px; border-bottom: 1px solid #C9D3DD; font-weight: 700">Date</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700">Document</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700">Reference</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700">Details</th>
<th style="padding: 6px 12px 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">File</th>
</tr>
</thead>
<tbody>
<tr data-for="docs" data-as="d" style="{{ d.rowStyle }}">
<td style="padding: 6px 12px">{{ d.date }}</td>
<td style="padding: 6px 8px; font-weight: 600">{{ d.name }}</td>
<td style="padding: 6px 8px">{{ d.ref }}</td>
<td style="padding: 6px 8px; color: #3A4654">{{ d.detail }}</td>
<td style="padding: 6px 12px 6px 8px; text-align: right"><a href="#download">Download PDF</a></td>
</tr>
</tbody>
</table>
</div>
</section>
</main>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'all' };
  }
  renderVals() {
    const all = [
      ['06-Nov-2026', 'custody', 'Chain-of-custody record', 'RT-2290', '5 bags · delivered 12:31 · signed J. Ruiz'],
      ['06-Nov-2026', 'temp', 'Temperature log', 'RT-2290', 'Cooler A · 4.6–4.9 °C · no excursions'],
      ['05-Nov-2026', 'rmw', 'Medical waste shipping papers', 'RW-0388', '4 containers · UN3291'],
      ['05-Nov-2026', 'treat', 'Treatment confirmation', 'RW-0388', 'Received and treated by facility'],
      ['05-Nov-2026', 'custody', 'Chain-of-custody record', 'RT-2284', '4 bags · delivered 16:42'],
      ['04-Nov-2026', 'custody', 'Chain-of-custody record', 'ST-1097', 'STAT · 2 bags · delivered 10:18'],
      ['04-Nov-2026', 'temp', 'Temperature log', 'ST-1097', 'Cooler B · 3.9–4.4 °C · no excursions'],
      ['03-Nov-2026', 'custody', 'Chain-of-custody record', 'RT-2276', '6 bags · delivered 12:27'],
      ['01-Nov-2026', 'statement', 'Monthly service statement', 'October 2026', '41 stops · 4 STAT · 12 containers'],
      ['29-Oct-2026', 'rmw', 'Medical waste shipping papers', 'RW-0371', '3 containers · UN3291'],
      ['29-Oct-2026', 'treat', 'Treatment confirmation', 'RW-0371', 'Received and treated by facility'],
      ['01-Oct-2026', 'statement', 'Monthly service statement', 'September 2026', '38 stops · 3 STAT · 10 containers']
    ];
    const t = this.state.type;
    const docs = all.filter(d => t === 'all' || d[1] === t).map((d, i) => ({ date: d[0], name: d[2], ref: d[3], detail: d[4], rowStyle: 'border-bottom:1px solid #E1E6EB;background:' + (i % 2 ? '#F7F9FB' : '#FFFFFF') }));
    return {
      docs,
      countLabel: docs.length + (docs.length === 1 ? ' Document' : ' Documents'),
      setType: (e) => this.setState({ type: e.target.value })
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
