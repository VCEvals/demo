<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedRoute — Reports</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E8ECF0}
a{color:#1A5A96}a:hover{color:#0E3F6E}
</style>


</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif; font-size: 14px; color: #1B2430; background: #E8ECF0; min-height: 100vh">

<div style="background: #1A4E80; color: #FFFFFF; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 16px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="0" y="0" width="22" height="22" rx="2" fill="#FFFFFF"></rect><path d="M9 4h4v5h5v4h-5v5H9v-5H4V9h5z" fill="#1A4E80"></path></svg>
<span style="font-weight: 700; font-size: 16px">MedRoute</span>
<span style="font-size: 13px; color: #CFE0F0">Courier Logistics · Richmond Metro Hub</span>
</div>
<div style="display: flex; align-items: center; gap: 16px; font-size: 13px; color: #CFE0F0">
<span>Fri 06-Nov-2026 13:18</span>
<span>Dispatcher: A. Reyes</span>
<button type="button" style="min-height: 32px; padding: 0 10px; border: 1px solid #7FA6CB; background: transparent; color: #FFFFFF; border-radius: 2px; font: 600 13px 'Source Sans 3', Arial, sans-serif; cursor: pointer">Log out</button>
</div>
</div>

<nav aria-label="Modules" style="background: #F7F9FB; border-bottom: 1px solid #AEBBC8; display: flex; flex-wrap: wrap; padding: 0 12px">
<a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: #2E3A48; text-decoration: none">Dispatch Board</a>
<a href="compliance.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: #2E3A48; text-decoration: none">Compliance</a>
<a href="driver.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: #2E3A48; text-decoration: none">Driver Handheld</a>
<a href="portal.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: #2E3A48; text-decoration: none">Client Portal</a>
<a href="reports.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; font-weight: 700; color: #1A4E80; text-decoration: none; background: #FFFFFF; border-left: 1px solid #AEBBC8; border-right: 1px solid #AEBBC8; border-top: 3px solid #1A4E80; margin-bottom: -1px">Reports</a>
</nav>

<div style="background: #DCE6EF; border-bottom: 1px solid #AEBBC8; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 28px; font-size: 13px">
<span><span style="color: #4A5664">Hub:</span> <strong>Richmond Metro</strong></span>
<span><span style="color: #4A5664">Period:</span> <strong>{{ periodLabel }}</strong></span>
</div>

<main style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; max-width: 1600px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">Reports</h1>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
<div role="group" aria-label="Period" style="display: flex">
<button type="button" onClick="{{ setWeek }}" aria-pressed="{{ isWeek }}" style="{{ weekStyle }}">This Week</button>
<button type="button" onClick="{{ setMonth }}" aria-pressed="{{ isMonth }}" style="{{ monthStyle }}">This Month</button>
</div>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 2px; border: 1px solid #8C9AA8; background: #FFFFFF; color: #1B2430; font: 600 14px 'Source Sans 3', Arial, sans-serif; cursor: pointer">Export CSV</button>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 2px; border: 1px solid #14406A; background: #1A5A96; color: #FFFFFF; font: 600 14px 'Source Sans 3', Arial, sans-serif; cursor: pointer">Export PDF</button>
</div>
</div>

<section aria-label="Summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); background: #FFFFFF; border: 1px solid #AEBBC8">
<div data-for="kpis" data-as="k" style="padding: 10px 14px; border-right: 1px solid #D5DDE5">
<div style="font-size: 12px; color: #4A5664; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em">{{ k.label }}</div>
<div style="margin-top: 2px; font-size: 24px; font-weight: 700">{{ k.value }}</div>
<div style="font-size: 12px; color: #4A5664">{{ k.sub }}</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start">

<section aria-label="Deliveries per day" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #AEBBC8">
<div style="display: flex; justify-content: space-between; align-items: center; background: #EEF2F6; border-bottom: 1px solid #AEBBC8; padding: 6px 12px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">Completed Stops per Day</h2>
<span style="font-size: 12px; color: #4A5664">Specimen · RMW · General</span>
</div>
<div style="padding: 16px 12px 8px; display: flex; align-items: flex-end; gap: 6px; height: 220px" role="img" aria-label="Bar chart of completed stops per day">
<div data-for="bars" data-as="b" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-size: 12px; font-weight: 700">{{ b.total }}</span>
<div style="width: 100%; display: flex; flex-direction: column">
<div style="{{ b.genStyle }}"></div>
<div style="{{ b.rmwStyle }}"></div>
<div style="{{ b.specStyle }}"></div>
</div>
<span style="font-size: 12px; color: #4A5664">{{ b.label }}</span>
</div>
</div>
<div style="display: flex; gap: 16px; padding: 0 12px 12px; font-size: 12px; color: #2E3A48">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; background: #1A5A96; display: inline-block"></span>Specimen</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; background: #C27A2C; display: inline-block"></span>Medical waste</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; background: #A9B4C0; display: inline-block"></span>General</span>
</div>
</section>

<section aria-label="Compliance summary" style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #AEBBC8">
<div style="background: #EEF2F6; border-bottom: 1px solid #AEBBC8; padding: 6px 12px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">Compliance Summary</h2>
</div>
<table style="width: 100%; border-collapse: collapse; font-size: 13px">
<tbody>
<tr data-for="compliance" data-as="c" style="border-bottom: 1px solid #E1E6EB">
<td style="padding: 8px 12px">{{ c.label }}</td>
<td style="padding: 8px 12px; text-align: right; font-weight: 700">{{ c.value }}</td>
</tr>
</tbody>
</table>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start">

<section aria-label="By client" style="flex: 1 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #AEBBC8">
<div style="background: #EEF2F6; border-bottom: 1px solid #AEBBC8; padding: 6px 12px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">By Client</h2>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px">
<thead>
<tr style="text-align: left; background: #F7F9FB">
<th style="padding: 6px 12px; border-bottom: 1px solid #C9D3DD; font-weight: 700">Client</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">Stops</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">STAT</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">On-Time</th>
<th style="padding: 6px 12px 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">Billed</th>
</tr>
</thead>
<tbody>
<tr data-for="clients" data-as="c" style="{{ c.rowStyle }}">
<td style="padding: 6px 12px; font-weight: 600">{{ c.name }}</td>
<td style="padding: 6px 8px; text-align: right">{{ c.stops }}</td>
<td style="padding: 6px 8px; text-align: right">{{ c.stat }}</td>
<td style="padding: 6px 8px; text-align: right">{{ c.ontime }}</td>
<td style="padding: 6px 12px 6px 8px; text-align: right">{{ c.billed }}</td>
</tr>
</tbody>
</table>
</div>
</section>

<section aria-label="By driver" style="flex: 1 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #AEBBC8">
<div style="background: #EEF2F6; border-bottom: 1px solid #AEBBC8; padding: 6px 12px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">By Driver</h2>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px">
<thead>
<tr style="text-align: left; background: #F7F9FB">
<th style="padding: 6px 12px; border-bottom: 1px solid #C9D3DD; font-weight: 700">Driver</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">Stops</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">Miles</th>
<th style="padding: 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">On-Time</th>
<th style="padding: 6px 12px 6px 8px; border-bottom: 1px solid #C9D3DD; font-weight: 700; text-align: right">Exceptions</th>
</tr>
</thead>
<tbody>
<tr data-for="drivers" data-as="d" style="{{ d.rowStyle }}">
<td style="padding: 6px 12px; font-weight: 600">{{ d.name }}</td>
<td style="padding: 6px 8px; text-align: right">{{ d.stops }}</td>
<td style="padding: 6px 8px; text-align: right">{{ d.miles }}</td>
<td style="padding: 6px 8px; text-align: right">{{ d.ontime }}</td>
<td style="padding: 6px 12px 6px 8px; text-align: right">{{ d.exc }}</td>
</tr>
</tbody>
</table>
</div>
</section>
</div>

</main>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { period: 'week' };
  }
  renderVals() {
    const week = this.state.period === 'week';
    const zebra = i => 'border-bottom:1px solid #E1E6EB;background:' + (i % 2 ? '#F7F9FB' : '#FFFFFF');
    const toggle = on => 'min-height:36px;padding:0 14px;border:1px solid #8C9AA8;font:600 14px \'Source Sans 3\',Arial,sans-serif;cursor:pointer;' + (on ? 'background:#1A4E80;color:#FFFFFF;border-color:#14406A' : 'background:#FFFFFF;color:#1B2430');
    const days = week
      ? [['Mon', 112, 14, 38], ['Tue', 118, 22, 35], ['Wed', 109, 12, 41], ['Thu', 121, 18, 36], ['Fri', 98, 24, 20], ['Sat', 31, 0, 12], ['Sun', 0, 0, 4]]
      : [['Wk 1', 512, 78, 160], ['Wk 2', 548, 84, 151], ['Wk 3', 530, 80, 172], ['Wk 4', 559, 90, 148], ['Wk 5', 230, 40, 58]];
    const max = Math.max(...days.map(d => d[1] + d[2] + d[3]));
    const h = v => Math.round(v / max * 150);
    const bars = days.map(d => ({
      label: d[0], total: d[1] + d[2] + d[3],
      specStyle: 'height:' + h(d[1]) + 'px;background:#1A5A96',
      rmwStyle: 'height:' + h(d[2]) + 'px;background:#C27A2C',
      genStyle: 'height:' + h(d[3]) + 'px;background:#A9B4C0'
    }));
    const kpis = week ? [
      { label: 'Completed Stops', value: '812', sub: '+6.4% vs last week' },
      { label: 'On-Time Rate', value: '96.8%', sub: 'Target 95.0%' },
      { label: 'Miles Driven', value: '3,904', sub: '412 mi saved by optimizer' },
      { label: 'Cost per Stop', value: '$9.42', sub: 'Last week $10.05' },
      { label: 'Revenue', value: '$18,640', sub: 'Billed, sample figures' }
    ] : [
      { label: 'Completed Stops', value: '3,245', sub: '+11.2% vs October' },
      { label: 'On-Time Rate', value: '96.4%', sub: 'Target 95.0%' },
      { label: 'Miles Driven', value: '15,870', sub: '1,690 mi saved by optimizer' },
      { label: 'Cost per Stop', value: '$9.61', sub: 'October $10.38' },
      { label: 'Revenue', value: '$74,215', sub: 'Billed, sample figures' }
    ];
    const m = week ? 1 : 4.1;
    const clients = [
      ['James River Reference Lab', 214, 9, '98.1%', 6240],
      ['Westpark Family Medicine', 96, 6, '97.9%', 2310],
      ['Henrico Urgent Care', 88, 11, '95.5%', 2780],
      ['Bon Air Dialysis Center', 74, 3, '98.6%', 1690],
      ['Chesterfield Dental Group', 22, 0, '100%', 880]
    ].map((c, i) => ({ name: c[0], stops: Math.round(c[1] * m).toLocaleString(), stat: Math.round(c[2] * m), ontime: c[3], billed: '$' + Math.round(c[4] * m).toLocaleString(), rowStyle: zebra(i) }));
    const drivers = [
      ['Alvarez, M.', 92, 401, '98.9%', 0], ['Okafor, D.', 88, 422, '97.7%', 1], ['Harris, J.', 85, 388, '97.6%', 0],
      ['Patel, R.', 81, 436, '93.8%', 2], ['Nguyen, T.', 54, 512, '96.3%', 1], ['Kim, S.', 97, 365, '96.9%', 0]
    ].map((d, i) => ({ name: d[0], stops: Math.round(d[1] * m), miles: Math.round(d[2] * m).toLocaleString(), ontime: d[3], exc: Math.round(d[4] * m), rowStyle: zebra(i) }));
    const compliance = week ? [
      { label: 'Custody records created', value: '2,118' }, { label: 'Records missing a signature', value: '0' },
      { label: 'Temperature excursions', value: '2' }, { label: 'RMW loads over 20 h', value: '1' }, { label: 'Training renewals due (30 days)', value: '1' }
    ] : [
      { label: 'Custody records created', value: '8,734' }, { label: 'Records missing a signature', value: '3' },
      { label: 'Temperature excursions', value: '7' }, { label: 'RMW loads over 20 h', value: '2' }, { label: 'Training renewals due (30 days)', value: '1' }
    ];
    return {
      bars, kpis, clients, drivers, compliance,
      periodLabel: week ? 'Week of 02-Nov-2026' : 'November 2026 (to date)',
      isWeek: week, isMonth: !week,
      weekStyle: toggle(week) + ';border-radius:2px 0 0 2px',
      monthStyle: toggle(!week) + ';border-radius:0 2px 2px 0;margin-left:-1px',
      setWeek: () => this.setState({ period: 'week' }),
      setMonth: () => this.setState({ period: 'month' })
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
